<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecniTrack - Nuevo Ticket</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="navbar">
    <a class="navbar-brand" href="dashboard.html">TecniTrack</a>
    <span class="navbar-role">Técnico · Luis Fernández</span>
  </header>

  <nav class="subnav">
    <a href="dashboard.html" class="active">Mis tickets</a>
  </nav>

  <div class="section-header">
    <p class="breadcrumb">Técnico / Mis tickets / Nuevo ticket</p>
    <h1>Nuevo ticket</h1>
  </div>

  <form class="form-container">
    <fieldset class="form-section">
      <legend>Cliente</legend>

      <div class="form-group">
        <label for="cliente-existente">Cliente existente</label>
        <select id="cliente-existente" name="cliente-existente">
          <option value="">Seleccione un cliente</option>
          <option value="maria-hernandez">María Elena Hernández — 7123-4567</option>
          <option value="carlos-ramirez">Carlos Alberto Ramírez — 7234-8912</option>
          <option value="ana-martinez">Ana Lucía Martínez — 7345-6720</option>
        </select>
      </div>

      <p class="text-small">O registrar un cliente nuevo:</p>
      <div class="form-row">
        <div class="form-group">
          <label for="cliente-nombre">Nombre completo</label>
          <input type="text" id="cliente-nombre" name="cliente-nombre" placeholder="Ej. Rosa Idalia Gómez">
        </div>
        <div class="form-group">
          <label for="cliente-telefono">Teléfono</label>
          <input type="tel" id="cliente-telefono" name="cliente-telefono" placeholder="Ej. 7456-1230">
        </div>
        <div class="form-group">
          <label for="cliente-correo">Correo electrónico</label>
          <input type="email" id="cliente-correo" name="cliente-correo" placeholder="Ej. rosa.gomez@example.com">
        </div>
      </div>
    </fieldset>

    <fieldset class="form-section">
      <legend>Equipo</legend>

      <div class="form-group">
        <label for="equipo-existente">Equipo existente</label>
        <select id="equipo-existente" name="equipo-existente">
          <option value="">Seleccione un equipo</option>
          <option value="dl-88291">Laptop Dell Inspiron 15 — María Elena Hernández</option>
          <option value="hp-55210">Computadora de escritorio HP Pavilion TP01 — Carlos Alberto Ramírez</option>
          <option value="ln-30987">Laptop Lenovo ThinkPad E14 — Ana Lucía Martínez</option>
          <option value="ep-40218">Impresora Epson L3250 — Ana Lucía Martínez</option>
        </select>
      </div>

      <p class="text-small">O registrar un equipo nuevo:</p>
      <div class="form-row">
        <div class="form-group">
          <label for="equipo-tipo">Tipo de equipo</label>
          <select id="equipo-tipo" name="equipo-tipo">
            <option value="">Seleccione un tipo</option>
            <option value="laptop">Laptop</option>
            <option value="escritorio">Computadora de escritorio</option>
            <option value="impresora">Impresora</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="equipo-marca">Marca</label>
          <input type="text" id="equipo-marca" name="equipo-marca" placeholder="Ej. Dell">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="equipo-modelo">Modelo</label>
          <input type="text" id="equipo-modelo" name="equipo-modelo" placeholder="Ej. Inspiron 15">
        </div>
        <div class="form-group">
          <label for="equipo-serie">Número de serie</label>
          <input type="text" id="equipo-serie" name="equipo-serie" placeholder="Ej. DL-88291">
        </div>
      </div>
    </fieldset>

    <div class="form-group">
      <label for="diagnostico-inicial">Diagnóstico inicial</label>
      <textarea id="diagnostico-inicial" name="diagnostico-inicial" rows="4" placeholder="Describa el problema reportado por el cliente..."></textarea>
    </div>

    <div class="form-group">
      <label for="fotos-equipo">Fotos del equipo</label>
      <div class="file-dropzone">
        <p>Arrastre las fotos aquí o seleccione un archivo</p>
        <input type="file" id="fotos-equipo" name="fotos-equipo" accept="image/*" multiple>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Crear ticket</button>
      <a class="btn btn-secondary" href="dashboard.html">Cancelar</a>
    </div>
  </form>
</body>
</html>
