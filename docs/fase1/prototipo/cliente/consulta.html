<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecniTrack - Consulta de Ticket</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <main class="role-select-screen">
    <div class="role-select-card">
      <p class="role-select-logo">TecniTrack</p>
      <p class="role-select-subtitle">Consulta el estado de tu ticket de servicio</p>

      <form>
        <div class="form-group">
          <label for="folio">Folio del ticket</label>
          <input type="text" id="folio" name="folio" placeholder="Ej. TT-2026-0040">
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono registrado</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej. 7345-6720">
        </div>

        <div class="role-select-options">
          <a class="btn btn-primary" href="ticket-estado.html">Consultar</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
